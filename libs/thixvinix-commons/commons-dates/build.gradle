plugins {
    id 'thixvinix.java-library-conventions'
}

description = 'Cross-field date-range Jakarta Bean Validation constraint (class-level, repeatable), with Jackson @JsonProperty and reflective Spring @BindParam awareness for error-message field names.'

dependencies {
    api project(':commons-validation-core')
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.0'

    testImplementation testFixtures(project(':commons-i18n'))
    testImplementation testFixtures(project(':commons-validation-core'))
    // Only to compile the @BindParam test fixture; the main sources resolve @BindParam reflectively.
    testImplementation 'org.springframework:spring-web:6.1.11'
}
