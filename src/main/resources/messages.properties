# Root fallback bundle (no locale suffix): resolved when the request locale (and its
# language-only fallback) has no dedicated bundle, e.g. Locale.ROOT or an unsupported language.
# Mirrors messages_en.properties.

########################################################################################################################
# Validation messages for fields sent by requests:
# (CPF/CNPJ, ENUM, and file validations are now owned by the thixvinix-commons libraries and
# their own message bundles — see commons-spring-boot-starter's autoconfiguration. The date.range
# keys below stay here too: DateUtils.checkDateRange() throws a BusinessException using them
# directly, independently of the @DateRangeValidation constraint now provided by commons-dates.)
########################################################################################################################
msg.validation.request.field.date.range.empty=Both dates {0} and {1} must be filled in or both must be missing.
msg.validation.request.field.date.range.invalid={0} must be before {1}.
msg.validation.request.field.phoneNumber.invalidFormat=Expected format: (XX) XXXXX-XXXX

########################################################################################################################
# Messages for invalid date deserialization:
########################################################################################################################
msg.deserialization.invalid.datetime.format=Date is invalid: {0}; expected format is {1}.

########################################################################################################################
# Messages used for exception handling (GlobalExceptionHandler.class):
########################################################################################################################
msg.exception.handler.resource.not.found=Resource not found.
msg.exception.handler.resource.url.not.found=The requested resource was not found. Please check the submitted URL and try again.
msg.exception.handler.json.malformed=Malformed JSON request.
msg.exception.handler.missing.parameter=Missing required parameter.
msg.exception.handler.missing.header=Missing required header.
msg.exception.handler.validation.failure=The request contains validation error(s). Please check the documentation and try again.
msg.exception.handler.argument.type.invalid=Invalid argument.
msg.exception.handler.argument.type.mismatch.default=It is not possible to convert the value {1} to the required type {0}.
msg.exception.handler.argument.type.mismatch.with.format=Must be in the format {0}, received value: {1}.
msg.exception.handler.argument.type.mismatch.without.format=It is in invalid format, received value: {0}.
msg.exception.handler.unknown.bad.request.error=An error occurred in the submitted request, please check the submitted parameters and try again.
msg.exception.handler.unknown.error=Unexpected error, please try again later.
msg.exception.handler.http.method.not.supported=The HTTP method {0} is not supported for this URL, please check the documentation for allowed methods.
msg.exception.handler.unauthorized.default=Access denied.
msg.exception.handler.access.denied.default=Not enough privileges to complete the operation.
msg.exception.handler.invalid.deserialize=A value of type {0} is expected.
msg.exception.handler.data.integrity.violation.default=The operation failed due to data integrity violation.
msg.exception.handler.timeout.default=The operation timed out. Please try again later.
msg.exception.handler.media.type.not.acceptable.default=The type of media sent is not acceptable. Update your request to include supported media types.
msg.exception.handler.media.type.not.supported.default=The provided media type is not supported. Check the 'Content-Type' header in the request.
msg.exception.handler.max.upload.size.exceeded.default=Upload size exceeds the allowed limit.
msg.exception.handler.service.unavailable.default=The service is currently unavailable. Please try again later.
msg.exception.handler.bad.gateway.default=The server received an invalid response from the upstream server. Please try again later.
msg.exception.handler.web.client.error=An error occurred while calling the external service. Details: {0}
